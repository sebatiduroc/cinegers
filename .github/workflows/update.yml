name: Mise à jour du programme

on:
  schedule:
    - cron: "30 4 * * *"   # chaque jour vers 5h30-6h30 (heure de Paris)
  workflow_dispatch:        # lancement manuel depuis l'onglet Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installation de pypdf (lecture du tract de Beaumont)
        run: pip install pypdf
      - name: Collecte du programme
        run: python scripts/collect.py
      - name: Publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add programme.json
          git diff --cached --quiet || (git commit -m "Programme du $(date +%F)" && git push)
